services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: veritas
      POSTGRES_PASSWORD: veritas
      POSTGRES_DB: veritas
    ports:
      - "5432:5432"
    volumes:
      - veritas_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veritas -d veritas"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://veritas:veritas@db:5432/veritas
      DATABASE_URL_SYNC: postgresql://veritas:veritas@db:5432/veritas
      REDIS_URL: redis://redis:6379/0
      USE_MOCK_LLM: "true"
      USE_MOCK_SSO: "true"
      USE_PGVECTOR: "true"
      FRONTEND_URL: http://localhost:3000
      LOCAL_STORAGE_PATH: /app/storage
    volumes:
      - ./backend/app:/app/app
      - veritas_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: ./backend
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://veritas:veritas@db:5432/veritas
      REDIS_URL: redis://redis:6379/0
      USE_MOCK_LLM: "true"
      USE_MOCK_SSO: "true"
      USE_PGVECTOR: "true"
      LOCAL_STORAGE_PATH: /app/storage
    volumes:
      - ./backend/app:/app/app
      - veritas_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info

  beat:
    build: ./backend
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://veritas:veritas@db:5432/veritas
      REDIS_URL: redis://redis:6379/0
      USE_PGVECTOR: "true"
      LOCAL_STORAGE_PATH: /app/storage
    volumes:
      - ./backend/app:/app/app
      - veritas_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=info

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - api

volumes:
  veritas_pg:
  veritas_storage:
