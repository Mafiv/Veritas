# GitHub Actions CI

name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check app tests evaluation
      - name: Ruff format
        run: ruff format --check app tests evaluation
      - name: Mypy (typed core)
        run: mypy
      - name: Unit tests
        run: pytest tests/unit -q

  migrations:
    name: Backend · migrations + integration tests (Postgres + pgvector)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: veritas
          POSTGRES_PASSWORD: veritas
          POSTGRES_DB: veritas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U veritas"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://veritas:veritas@localhost:5432/veritas
      DATABASE_URL_SYNC: postgresql://veritas:veritas@localhost:5432/veritas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Apply migrations
        run: alembic upgrade head
      - name: Models match migrations (no drift)
        run: alembic check
      - name: Integration tests
        run: pytest tests/integration -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://veritas:veritas@localhost:5432/veritas

  retrieval-eval:
    name: Retrieval eval · regression gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: veritas
          POSTGRES_PASSWORD: veritas
          POSTGRES_DB: veritas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U veritas"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://veritas:veritas@localhost:5432/veritas
      DATABASE_URL_SYNC: postgresql://veritas:veritas@localhost:5432/veritas
      MODEL_CACHE_DIR: /home/runner/.cache/veritas-models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/veritas-models
          key: veritas-models-bge-small-en-v1.5
      - name: Install
        run: pip install -e ".[dev]"
      - name: Apply migrations
        run: alembic upgrade head
      - name: Evaluate retrieval (fails on regression vs evaluation/baseline.json)
        run: python -m evaluation.run --fast --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-eval
          path: backend/evaluation/results/

  frontend:
    name: Frontend · lint, types, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: ESLint
        run: npx eslint .
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
