[project]
name = "veritas"
version = "0.1.0"
description = "Veritas — RAG-based Chat with your data SaaS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.1",
    "python-multipart>=0.0.17",
    "httpx>=0.28.0",
    "redis>=5.2.0",
    "celery[redis]>=5.4.0",
    "stripe>=11.0.0",
    "pypdf>=5.1.0",
    "python-docx>=1.1.0",
    "markdown-it-py>=3.0.0",
    "tiktoken>=0.8.0",
    "numpy>=2.1.0",
    "pgvector>=0.3.6",
    "aiofiles>=24.1.0",
    "orjson>=3.10.0",
    "prometheus-client>=0.21.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "litellm>=1.55.0",
    "PyJWT[crypto]>=2.8.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
